<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 470" width="1052" height="470" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="PCN Review Copilot architecture: AI recommends, officer decides, Mubit learns">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1052" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="24" y="34" font-size="18" font-weight="700" fill="#111827">PCN Review Copilot: how it works</text>
  <text x="24" y="56" font-size="13" fill="#4b5563">AI recommends · officer decides · Mubit learns from every correction</text>

  <!-- Legend -->
  <rect x="700" y="45" width="12" height="12" rx="3" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="718" y="55" font-size="12" fill="#4b5563">Data / system</text>
  <rect x="816" y="45" width="12" height="12" rx="3" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="834" y="55" font-size="12" fill="#4b5563">AI</text>
  <rect x="866" y="45" width="12" height="12" rx="3" fill="#ecfdf5" stroke="#059669"/>
  <text x="884" y="55" font-size="12" fill="#4b5563">Human decision</text>

  <!-- Row 1 -->
  <g>
    <rect x="24" y="80" width="172" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.25"/>
    <text x="110" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Council data</text>
    <text x="110" y="126" text-anchor="middle" font-size="11.5" fill="#374151">PCN system, payments,</text>
    <text x="110" y="142" text-anchor="middle" font-size="11.5" fill="#374151">permits, badges, policy</text>
  </g>
  <g>
    <rect x="232" y="80" width="172" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.25"/>
    <text x="318" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Rules engine</text>
    <text x="318" y="126" text-anchor="middle" font-size="11.5" fill="#374151">proves the simple facts</text>
    <text x="318" y="142" text-anchor="middle" font-size="11.5" fill="#374151">+ 56-day clock</text>
  </g>
  <g>
    <rect x="440" y="80" width="172" height="80" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="526" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">AI review</text>
    <text x="526" y="126" text-anchor="middle" font-size="11.5" fill="#374151">ground, policy clause,</text>
    <text x="526" y="142" text-anchor="middle" font-size="11.5" fill="#374151">accept / reject as JSON</text>
  </g>
  <g>
    <rect x="648" y="80" width="172" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.25"/>
    <text x="734" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Guardrails</text>
    <text x="734" y="126" text-anchor="middle" font-size="11.5" fill="#374151">validate, then route to</text>
    <text x="734" y="142" text-anchor="middle" font-size="11.5" fill="#374151">Fast / Review / Judgement</text>
  </g>
  <g>
    <rect x="856" y="80" width="172" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="942" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Officer console</text>
    <text x="942" y="126" text-anchor="middle" font-size="11.5" fill="#374151">confirm or override</text>
    <text x="942" y="142" text-anchor="middle" font-size="11.5" fill="#374151">the officer decides</text>
  </g>

  <!-- Row 1 arrows -->
  <g fill="none" stroke="#6b7280" stroke-width="1.5">
    <path d="M196 120H230" marker-end="url(#arrow)"/>
    <path d="M404 120H438" marker-end="url(#arrow)"/>
    <path d="M612 120H646" marker-end="url(#arrow)"/>
    <path d="M820 120H854" marker-end="url(#arrow)"/>
    <path d="M942 160V198" marker-end="url(#arrow)"/>
  </g>

  <!-- AI review <-> Mubit -->
  <path d="M526 162V198" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-start="url(#arrow-ai)" marker-end="url(#arrow-ai)"/>
  <text x="536" y="185" font-size="11.5" fill="#6d28d9">every call</text>

  <!-- Mubit gateway -->
  <g>
    <rect x="406" y="200" width="240" height="64" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="526" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Mubit gateway</text>
    <text x="526" y="246" text-anchor="middle" font-size="11.5" fill="#374151">records calls, trains adapter</text>
  </g>

  <!-- Models -->
  <g fill="none" stroke="#7c3aed" stroke-width="1.5">
    <path d="M478 264L452 308" marker-end="url(#arrow-ai)"/>
    <path d="M574 264L600 308" marker-end="url(#arrow-ai)"/>
  </g>
  <g>
    <rect x="374" y="310" width="144" height="60" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.25"/>
    <text x="446" y="334" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Frontier model</text>
    <text x="446" y="353" text-anchor="middle" font-size="11" fill="#374151">teacher at first</text>
  </g>
  <g>
    <rect x="534" y="310" width="144" height="60" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.25"/>
    <text x="606" y="334" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Council adapter</text>
    <text x="606" y="353" text-anchor="middle" font-size="11" fill="#374151">cheaper, once it passes</text>
  </g>

  <!-- Decision + letter -->
  <g>
    <rect x="856" y="200" width="172" height="64" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.25"/>
    <text x="942" y="226" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Decision + letter</text>
    <text x="942" y="246" text-anchor="middle" font-size="11.5" fill="#374151">approved templates</text>
  </g>

  <!-- Feedback loop -->
  <path d="M856 232H648" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="752" y="222" text-anchor="middle" font-size="11.5" font-weight="600" fill="#047857">overrides + tribunal outcomes</text>
  <text x="752" y="252" text-anchor="middle" font-size="11.5" fill="#047857">the learning signal</text>

  <!-- Audit log -->
  <g>
    <rect x="24" y="404" width="1004" height="40" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.25"/>
    <text x="526" y="429" text-anchor="middle" font-size="12.5" fill="#374151"><tspan font-weight="600" fill="#111827">Audit log</tspan>: every input, recommendation, model version and officer action, which feeds the metrics</text>
  </g>
</svg>
