<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Civic product architecture</title>
  <desc id="desc">A driver browser accesses React and FastAPI on Render. Render uses Neon for database storage and email-code authentication, Mubit for model inference and bundled guidance for assessments. The browser uses a parking map. Drivers review and download an appeal pack, then submit it outside Civic.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3564e8"/></marker>
    <style>
      .title {font:700 30px Arial,sans-serif;fill:#20241f}
      .sub {font:16px Arial,sans-serif;fill:#555e55}
      .label {font:700 21px Arial,sans-serif;fill:#20241f}
      .text {font:16px Arial,sans-serif;fill:#3e493e}
      .small {font:14px Arial,sans-serif;fill:#555e55}
      .box {fill:#fffefa;stroke:#b9c3b0;stroke-width:1.5}
      .line {fill:none;stroke:#3564e8;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" rx="16" fill="#f4f2e9"/>
  <text x="36" y="49" class="title">civic. / How it works</text>
  <text x="36" y="79" class="sub">One application on Render. Persistent identity and data in Neon. AI through Mubit.</text>

  <path class="line" d="M306 205 H399"/>
  <text x="335" y="190" class="small">HTTPS</text>
  <path class="line" d="M735 205 H828"/>
  <path class="line" d="M171 295 V384"/>
  <path class="line" d="M570 295 V384"/>
  <path class="line" d="M690 295 V338 H999 V384"/>
  <text x="740" y="327" class="small">Consented facts + images</text>

  <rect x="36" y="115" width="270" height="180" rx="14" class="box"/>
  <text x="58" y="152" class="label">Driver browser</text>
  <text x="58" y="185" class="text">Sign up with an email code</text>
  <text x="58" y="214" class="text">Scan or enter a notice</text>
  <text x="58" y="243" class="text">Confirm, assess and edit</text>
  <text x="58" y="272" class="small">Public home and sample demo</text>

  <rect x="405" y="115" width="330" height="180" rx="14" fill="#eaf0ff" stroke="#3564e8" stroke-width="2"/>
  <text x="428" y="152" class="label">Render / Docker</text>
  <text x="428" y="185" class="text">React + FastAPI, same origin</text>
  <text x="428" y="214" class="text">Private cases and approved exports</text>
  <text x="428" y="243" class="text">One Uvicorn worker</text>
  <text x="428" y="272" class="small">Separate council access and workflow</text>

  <rect x="834" y="115" width="330" height="180" rx="14" class="box"/>
  <text x="857" y="152" class="label">Neon</text>
  <text x="857" y="185" class="text">PostgreSQL: cases, photos, history</text>
  <text x="857" y="214" class="text">Auth: Better Auth users/sessions</text>
  <text x="857" y="243" class="text">Email-code signup and sign-in</text>
  <text x="857" y="272" class="small">Same branch for Auth and application</text>

  <rect x="36" y="390" width="270" height="170" rx="14" class="box"/>
  <text x="58" y="427" class="label">Parking discovery</text>
  <text x="58" y="460" class="text">MapLibre + OpenFreeMap</text>
  <text x="58" y="489" class="text">OSM snapshot + Photon*</text>
  <text x="58" y="529" class="small">Locations, not live vacant bays</text>

  <rect x="405" y="390" width="330" height="170" rx="14" class="box"/>
  <text x="428" y="427" class="label">Dated guidance</text>
  <text x="428" y="460" class="text">Seven bundled source summaries</text>
  <text x="428" y="489" class="text">Typed answers and reference checks</text>
  <text x="428" y="529" class="small">User confirms facts and approves draft</text>

  <rect x="834" y="390" width="330" height="170" rx="14" fill="#e8f2d1" stroke="#94a972" stroke-width="1.5"/>
  <text x="857" y="427" class="label">Mubit → model provider</text>
  <text x="857" y="460" class="text">Vision extraction + appeal guidance</text>
  <text x="857" y="489" class="text">Training recording: separate opt-in</text>
  <text x="857" y="529" class="small">No automatic correction training</text>

  <text x="36" y="590" class="small">* Parking records and Photon search use the API; map tiles load in the browser.</text>
  <rect x="36" y="612" width="1128" height="42" rx="8" fill="#20241f"/>
  <text x="59" y="639" style="font:16px Arial,sans-serif;fill:#f7f6ef">Driver reviews → approves → downloads → submits to the issuer outside Civic. No automatic submission or cancellation.</text>
</svg>
