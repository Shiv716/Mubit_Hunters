# For a NEW service. Existing mubit-hunters service: apply these settings in its dashboard.
# No credentials are stored here. The database is the user's existing Neon project.
# Approval notifications: add RESEND_API_KEY and PCN_EMAIL_FROM in Environment.
# Existing service: set the Auth URL and owner email together as described in docs/DEPLOYMENT.md.
services:
  - type: web
    name: mubit-hunters
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: PCN_ENV
        value: production
      - key: PCN_ACCESS_KEY
        sync: false
      - key: PCN_COOKIE_SECURE
        value: 'true'
      - key: NEON_AUTH_BASE_URL
        value: https://ep-dry-cake-za1nvk8t.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth
      - key: PCN_ACCESS_REQUEST_EMAIL
        sync: false
      - key: PCN_ALLOW_PASSWORD_LOGIN
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: PCN_DB_SCHEMA
        value: civic
      - key: PCN_EVIDENCE_STORAGE
        value: database
      - key: AI_PROVIDER
        value: stub
      - key: PCN_PUBLIC_ORIGIN
        value: https://mubit-hunters.onrender.com
