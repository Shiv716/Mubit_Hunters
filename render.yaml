# For a NEW service. Existing mubit-hunters service: apply these settings in its dashboard.
# No credentials are stored here. The database is the user's existing Neon project.
# Optional council owner notifications: RESEND_API_KEY and PCN_EMAIL_FROM.
# Public driver signup uses Neon email codes without owner approval.
# PCN_ACCESS_KEY is the cookie signing secret, not a driver password.
# Route below is an example; preserve the existing service's configured route/model.
# Existing service: set the Auth URL and owner email together as described in docs/DEPLOYMENT.md.
services:
  - type: web
    name: mubit-hunters
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: PCN_ENV
        value: production
      - key: PCN_ACCESS_KEY
        sync: false
      - key: PCN_COOKIE_SECURE
        value: 'true'
      - key: NEON_AUTH_BASE_URL
        value: https://ep-dry-cake-za1nvk8t.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth
      - key: PCN_ACCESS_REQUEST_EMAIL
        sync: false
      - key: PCN_ALLOW_PASSWORD_LOGIN
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: PCN_DB_SCHEMA
        value: civic
      - key: PCN_EVIDENCE_STORAGE
        value: database
      - key: AI_PROVIDER
        value: mubit
      - key: MUBIT_API_KEY
        sync: false
      - key: MUBIT_ROUTE
        value: anthropic
      - key: PCN_COUNCIL_ID
        value: northgate-sandbox
      - key: PCN_COUNCIL_NAME
        value: Northgate Borough
      - key: PCN_CASE_SYSTEM
        value: generic
      - key: PCN_PUBLIC_ORIGIN
        value: https://mubit-hunters.onrender.com
